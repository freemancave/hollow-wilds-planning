at","giant_ape_burnt_meat","mat","1"],["b_campfire","giant_ape_burnt_meat","station","굽기 실패"]],"iconBase":"https://raw.githubusercontent.com/freemancave/hollow-wilds-sheet-images/ca8a514012d06b48387a668bd42d440ba7661678/playflow-tree-20261104/","commit":"2026-11-07 보스 아이템·드랍·제작 실제 리소스 대조 (자동 기능 검증 별도)"},"layout":"{}","treeLayout":"{}","speech":{"source":"대사·연출 · 193~260행 · 2026-11-09","rows":[["■ 펩 자동 발화 · 현재 코드 대조 (2026-11-09 단계적 공개 적용)","","","","","","","",""],["읽는 법","11-09 코드 대조: 단계적 공개 원칙(docs/peb_staged_hint_design_principles_2026-11-09.md)과 전수조사(docs/peb_hint_audit_2026-11-09.md) 적용. 단계 칸의 분은 실제로 막힌 플레이 시간이며 warm은 0·1·2.5·5분. 발견형 목표의 4단계는 물을 때만. 자동 목표 19개(방어구 2종·journey 포함)·연결 알림 16개·기타 5개·미연결 3개. {공격}은 현재 공격 키. 대사 속 키 글자는 기본 설정 기준이며 게임에서는 현재 설정 키로 바뀜. 자동 기능 검증 미확인(Actions 결제 한도).","","","","","","",""],["분류","ID","제목","실제 발동 조건","해결·종료","1단계 0~5분","2단계 5~15분","3단계 15~30분","4단계 30분 이상"],["자동 목표","warm","몸 녹이기 (긴급: 0·1·2.5·5분)","동행 완료 + 현재 저체온증. 생존 목표라 탐험 중 유예 없음","저체온증 해제","1. 너 입술 파래졌어. 그거 요즘 유행이야?\n2. 이 덜덜 떠는 소리, 박자는 좋은데 걱정된다.\n3. 너 지금 얼음 조각 같아. 만지면 깨질 것 같아.","모닥불이 켜짐:\n1. 저 불, 구경하려고 피운 거 아니지?\n2. 불이 저기 있는데 왜 여기서 떨고 있어?\n3. 모닥불이 '이리 와'라고 손짓하는 것 같지 않아?\n불 없음:\n1. 이러다 얼음 조각상 되겠어. 뭔가 따뜻한 게 필요해.\n2. 젖은 채로 버티면 감기 정도로 안 끝나. 따뜻해질 방법을 찾자.\n3. 몸 좀 녹이자. 불 같은 거 없을까?","모닥불이 켜짐:\n1. 모닥불 곁에 딱 붙어 있어. 옷도 마를 거야.\n2. 불 가까이 가서 좀 쬐자. 오래 있으면 옷도 말라.\n3. 모닥불 옆이 지금 이 섬에서 제일 좋은 자리야.\n불 없음:\n1. 불을 피우자. 모닥불 하나면 살아.\n2. 모닥불을 만들면 몸도 녹이고 옷도 말릴 수 있어.\n3. 나뭇가지랑 돌로 모닥불을 놓아 보자.","모닥불이 켜짐 (펩이 불 쪽을 봄):\n1. 불붙은 모닥불 가까이 서 있기만 해. 이쪽이야!\n2. 모닥불 옆에 가만히 서 있으면 저체온이 풀려. 따라와!\n3. 모닥불 바로 옆으로! 오래 있으면 옷도 마른다.\n불 없음:\n1. 건설 모드(X)에서 모닥불 놓고, 가까이 가서 E로 불 피워. 빨리!\n2. X → 모닥불 설치 → 가까이서 E. 서둘러!\n3. 건설 모드(X)으로 모닥불을 놓고 E로 불을 붙여. 그다음 곁에 서 있어."],["자동 목표","eat","먹기","동행 완료 + 현재 배고픔/극심한 배고픔 계열 상태. 생존 목표라 탐험 중 유예 없음","배고픔 해제; 재발하면 재활성(채팅 단계 하한 유지)","1. 방금 네 배에서 천둥 쳤어. 나 아니야, 진짜로.\n2. 배에서 꾸르륵 소리 나는 거 다 들려. 누가 대답이라도 하겠다.\n3. 너 아까부터 내 꼬리를 군침 흘리며 보던데… 착각이겠지?","음식 없음:\n1. 배고픈 얼굴이네. 먹을 만한 열매나 구울 것을 찾아보자.\n2. 먹을 거 없이 버티는 건 영웅 놀이야. 주변에 열매 같은 거 안 보여?\n3. 배고프면 예민해지는 거 알지? 나한테 화내기 전에 뭐 좀 찾아 먹자.\n음식 있음:\n1. 아까 챙긴 거, 가방에서 썩힐 거야?\n2. 가방에 먹을 거 있잖아. 아껴 두다 상하면 더 슬퍼.\n3. 먹을 걸 들고 굶는 건 무슨 수행이야?","음식 없음:\n1. 열매를 찾아보거나, 구할 수 있는 고기를 불에 구워 먹자.\n2. 먹을 것을 찾으면 챙겨 두자. 모닥불에 구워 먹을 수도 있어.\n3. 열매나 구울 재료가 있는지 둘러보자.\n음식 있음:\n1. 가방에 과일 있잖아! 그거 하나면 살 것 같은데.\n2. 가방 속 먹을 것부터 하나 먹자. 지금 당장.\n3. 과일 하나만 먹어도 훨씬 나을 거야. 가방을 열어 봐.","음식 없음 (펩이 가까운 음식 쪽을 봄):\n1. 먹을 걸 E로 줍고 가방(Tab)에서 골라 [먹기]를 눌러.\n2. 고기는 불 붙은 모닥불 옆에서 E로 구워. 그다음 Tab → 음식 → [먹기].\n3. 열매는 바로 먹고, 고기는 모닥불에서 구워 먹자. 가방(Tab)에서 [먹기]!\n음식 있음:\n1. 가방(Tab) 열고 과일 골라서 [먹기]. 자, 아~ 해.\n2. Tab → 먹을 것 선택 → [먹기] 버튼. 끝!\n3. 가방(Tab)에서 음식을 고르고 [먹기]를 눌러. 그럼 배가 조용해질 거야."],["자동 목표","axe","돌도끼","동행 완료 + (재회 뒤 첫 식사/피곤함 이벤트 또는 돌도끼 재료 충족) + 소지 도끼 없음. 나뭇가지·돌·질긴 덩굴을 처음 발견하면 다음 단계 대기 재시작","돌/구리/철 도끼 소지","재료 충족 시 모든 단계 공통:\n1. 지금 가진 재료로 돌도끼를 만들 수 있어. 나무를 베어 목재를 얻으면 더 튼튼한 도구와 잠자리도 만들 수 있지. 제작 노트(C)를 열어 봐.\n2. 나뭇가지만 주워서는 한계가 있지? C에서 돌도끼를 만들자. 목재가 생기면 더 좋은 것들을 만들 수 있어.\n3. 돌도끼 재료가 다 모였네! C로 만들어 나무를 베자. 목재로 제작대도 놓고 더 좋은 장비를 만들어 보자.\n그 외:\n1. 맨손으로 나무랑 씨름할 생각이야? 손바닥에 불나겠다.\n2. 그 손톱으로 나무 베려면 백 년은 걸리겠다.\n3. 나무를 쓸 수 있으면 더 튼튼한 도구도, 쉴 자리도 만들 텐데. 연장이 필요하겠지?","재료 부족:\n1. 뭔가 날카로운 게 하나 있으면 좋을 텐데. 바닥에 쓸 만한 게 굴러다니던데?\n2. 돌이랑 나뭇가지를 보면 뭔가 떠오르지 않아? 나만 그래?\n3. 제대로 된 연장이 있으면 할 수 있는 게 확 늘어날 거야.","재료 부족:\n1. 나뭇가지랑 돌, 질긴 덩굴만 있으면 돌도끼를 만들 수 있어.\n2. 돌도끼 재료는 나뭇가지, 돌, 질긴 덩굴이야. 다 주변에 있어.\n3. 질긴 덩굴로 돌을 나뭇가지에 묶으면 돌도끼 완성!","재료 부족 + 채집처 안내가 있는 재료 (2026-11-09: 5분 → 30분):\n1. 돌도끼 재료가 어디 있었더라… {부족 재료별 채집처 문장}\n그 외 부족:\n1. 바닥에서 {부족분}를 E로 줍고, 제작 노트(C)에서 돌도끼!\n2. {부족분}를 더 모아 와. 그다음 C → 돌도끼 제작!\n3. {부족분}만 더 있으면 돼. 모이면 제작 노트(C)에서 돌도끼."],["자동 목표","chop","나무 베기","동행 완료 + 도끼 소지 + 일반 목재 미발견·미소지","목재 발견 또는 소지","1. 새 도끼 생겼는데 들고만 다닐 거야? 손이 근질근질하지 않아?\n2. 그 도끼, 장식용 아니지? 나무들이 떨고 있어.\n3. 도끼 든 모습 꽤 그럴듯한데? 이제 써 보기만 하면 돼.","1. 저 나무들 꽤 튼튼해 보이는데. 도끼 맛 좀 보여 줄래?\n2. 나무 하나 쓰러뜨리면 쓸 데가 많을 거야.\n3. 목재가 있으면 집도 짓고 침상도 만들 수 있다고 들었어.","1. 도끼를 손에 들고 나무를 찍어 봐. 목재가 나올 거야.\n2. 도끼를 들고 나무를 몇 번 치면 쓰러져. 그럼 목재!\n3. 나무를 베고 쓰러진 통나무를 치면 목재가 나와.","(펩이 가까운 나무 쪽을 봄)\n1. 퀵바에서 도끼를 들고 나무 앞에서 {공격}! 쓰러지면 통나무를 몇 번 더 쳐. 이쪽 나무 어때?\n2. 도끼 선택 → 나무 앞에서 {공격} 연타! 쓰러진 통나무도 쳐야 목재가 나와.\n3. 이 나무로 하자. 도끼를 들고 {공격}, 쓰러지면 통나무를 쳐!"],["자동 목표","bed","잠자리","피로 3종 중 하나 + shelter 존재 + 침상 없음(not _sleep_done). 생존 목표라 탐험 중 유예 없음. 목재·루멘 가죽 첫 발견 시 다음 단계 대기 재시작","침상 설치","1. 너 방금 서서 졸았지? 눈이 반쯤 감겼어.\n2. 하품하다 턱 빠지겠다. 좀 쉬어야겠어.\n3. 너 지금 눈 뜨고 자는 거 아니지? 무섭다.","1. 그렇게 졸다간 나무에 박겠다. 어디 편하게 누울 데가 필요해 보이는데?\n2. 바닥에서 자면 등 배겨. 제대로 된 잠자리가 있으면 좋겠다.\n3. 푹 자려면 누울 자리가 있어야지. 뭔가 만들어 볼까?","둘 다 부족:\n1. 잠자리 만들려면 목재랑 루멘 가죽이 필요할걸?\n2. 목재랑 루멘 가죽만 있으면 침상을 만들 수 있어.\n3. 침상 재료는 목재와 루멘 가죽. 둘 다 구해 보자.\n목재 부족:\n1. 가죽은 됐고, 목재만 좀 더.\n2. 목재가 조금 모자라. 나무 한 그루면 될 거야.\n3. 남은 건 목재뿐이야!\n가죽 부족:\n1. 목재는 충분해. 깔고 누울 루멘 가죽이 필요해.\n2. 루멘 가죽만 있으면 돼. 루멘리스크가 갖고 있을걸?\n3. 푹신한 루멘 가죽이 필요해.\n충족:\n1. 재료 다 모였어! 간이 침상 만들자.\n2. 이제 간이 침상을 놓기만 하면 돼!\n3. 재료 충분해. 간이 침상 설치하자!","부족분에 따라 한 문장 + 꼬리말(없음/ 졸지 말고!/ 내가 기다릴게.):\n도끼로 나무 베서 목재 {n}개, 루멘리스크 잡아서 루멘 가죽 {n}개. 다 모이면 건설 모드(X) → 우클릭 → 시설 탭 → 간이 침상!\n(충족 시) 건설 모드(X) → 우클릭 → 시설 탭 → 간이 침상! 평평한 곳에 {공격}."],["자동 목표","sleep","잠","침상 존재 + 피로 3종 중 하나. 생존 목표","피로 3종 모두 해제","1. 하품 좀 그만해. 나까지 졸려.\n2. 너 지금 걸으면서 자는 거 아니지?\n3. 눈꺼풀이 천 근이네. 내가 다 보여.","1. 침상 만들어 놓고 장식용으로 둘 거야?\n2. 그 멋진 침상, 누워 보지도 않을 거야?\n3. 침상이 너를 기다리고 있어. 진짜로.","1. 간이 침상에서 한숨 자면 피로가 싹 풀릴 거야.\n2. 침상에 누우면 피로가 풀려. 잠깐이면 돼.\n3. 피곤할 땐 침상이 최고야. 가서 눕자.","1. 침상 옆에서 E. 그럼 끝. 잘 자, 망은 내가 볼게.\n2. 침상 앞에서 E를 누르면 잠들어. 내가 지킬게.\n3. 침상으로 가서 E! 일어나면 개운할 거야."],["자동 목표","roof","지붕","미완료 잠자리 일지에 rain 기록 + 침상 위 가림 없음","침상 위 가림 또는 잠자리 일지 완료","1. 자는 동안 얼굴에 물 떨어지던데… 그거 세수였어?\n2. 밤새 물방울이 네 이마에서 북 치더라.\n3. 어젯밤 너 빗물로 샤워했지? 개운했어?","1. 머리 위가 뻥 뚫려 있으니 그렇지. 위를 좀 막아야겠어.\n2. 하늘이 너무 잘 보이는 침실이야. 좀 가리자.\n3. 물이 떨어지는 걸 막을 뭔가가 위에 있어야 해.","1. 침상 위에 지붕을 얹자.\n2. 지붕만 있으면 물방울 걱정 끝!\n3. 머리 위에 지붕을 올리자. 그럼 푹 잘 수 있어.","1. 건설 모드(X) → 우클릭 → 건물 탭 → 나무 지붕을 침상 위에. 목재 2개면 돼.\n2. X → 나무 지붕 선택 → 침상 위 벽에 붙여 설치! 목재 2개.\n3. 건설 모드(X)에서 나무 지붕을 골라 침상 위에 올려. 목재 2개면 충분해."],["자동 목표","walls","벽과 문","미완료 잠자리 일지에 attack 기록 + 침상이 막혀 있지 않음(0.5초마다 확인)","침상 둘레 막힘 또는 잠자리 일지 완료","1. 너 자는 동안 누가 간식 먹으러 왔더라. 간식은… 너였고.\n2. 어젯밤 손님 왔었어. 예의는 없더라.\n3. 자다가 물리는 건 좋은 아침 인사가 아니야.","1. 사방이 뚫려 있으면 또 올 거야. 막아야 하지 않을까?\n2. 문 없는 집은 그냥 뷔페야.\n3. 벽이 있으면 밤에 덜 시끄러울 텐데.","1. 침상 둘레를 벽으로 막고, 드나들 곳엔 문을 달자.\n2. 벽으로 둘러싸고 문 하나면 밤이 조용해질 거야.\n3. 벽과 문! 그게 오늘의 숙제야.","1. 건설 모드(X) → 우클릭 → 건물 탭 → 나무 벽으로 둘러싸고 한쪽은 나무 문. 자기 전엔 E로 문 닫기!\n2. X → 나무 벽으로 사방을 막고 나무 문을 달아. 잘 땐 E로 닫고!\n3. 건설 모드(X)에서 나무 벽, 나무 문을 골라 침상을 감싸. 문은 E로 닫아."],["자동 목표","workbench","제작대","동행 완료 + 목재 발견 + 구조물 탭 열림 + 완성된 제작대 없음","완성된 제작대 존재","첫 제작대 전:\n1. 배 재료를 찾으러 숲에 더 들어가려면 장비가 필요하겠지? 그걸 만들 제작대는 내가 먼저 지어 줄게.\n제작법을 배운 뒤:\n1. 숲에서 쓸 장비를 만들 자리가 다시 필요하겠네. 제작대 하나 세워 볼까?","첫 제작대 전:\n1. 숲에서 짐승을 마주칠 수도 있으니 장비를 좀 갖추자. 제작대가 있으면 목재를 다듬어 무기나 방패를 만들 수 있어.\n2. 목재를 다듬으려는데 땅바닥에서 자꾸 굴러가면 곤란하잖아. 제작대를 하나 두면 장비 만들기가 훨씬 수월해.\n3. 숲에 들고 갈 장비부터 챙겨 볼까? 단단한 걸 만들 땐 제작대가 있어야 손을 쓰기 편해.\n제작법을 배운 뒤:\n1. 튼튼한 무기나 방패를 만들려면 작업할 자리가 있어야 해. 전에 만든 제작대 기억나?","첫 제작대 전:\n1. 숲에 들고 갈 장비를 만들 자리부터 잡자. 목재 3개랑 평평한 자리가 있으면 첫 제작대는 내가 만들게.\n2. 목재를 제대로 다듬을 자리가 있으면 무기도 만들 수 있어. 목재 3개를 맡기면 내가 제작대를 짜 줄게.\n3. 장비 만들려면 제작대가 필요하니까 첫 번째는 내가 해 볼게. 만드는 걸 봐 두면 다음엔 네가 할 수 있어.\n제작법을 배운 뒤:\n1. 숲에 갈 장비를 만들려면 작업 자리부터 있어야겠네. 목재 3개면 제작대를 다시 세울 수 있어.","첫 제작대 전 (+ 목재 {n}개 더 필요해. / 재료는 충분해!):\n1. 숲에 가져갈 장비를 만들 자리부터 잡자. 건설 모드(X) → 우클릭 → 구조물 탭에서 제작대를 골라. 자리를 정해 주면 내가 30초쯤 만들게.\n2. 목재를 무기나 방패로 다듬을 자리가 필요해. X → 우클릭 → 구조물의 제작대에 펩 도움 표시가 있을 거야. 처음엔 내가 맡을게.\n3. 튼튼한 장비를 만들려면 흔들리지 않는 작업 자리가 좋겠어. 건설 모드(X)에서 제작대를 평평한 곳에 놓아 줘. 내가 30초쯤 작업할게.\n제작법을 배운 뒤:\n1. 장비를 만들 자리부터 되찾자. 건설 모드(X) → 우클릭 → 구조물 탭에서 제작대를 골라. 이번엔 네가 만들 수 있어."],["자동 목표","station_craft","제작대 제작","완성된 제작대 존재 + 나무 몽둥이·나무 방패 중 하나라도 제작 기록 없음","둘 다 제작","몽둥이 전:\n1. 숲에선 짐승이 먼저 달려들 때도 있어. 받아칠 수 있게 나무 몽둥이 하나 만들어 두면 어때?\n몽둥이 제작 뒤:\n1. 몽둥이는 생겼네! 미처 못 피한 공격은 나무 방패로 받아내면 어때?","몽둥이 전:\n1. 배 재료 찾다가 짐승이 덤비면 받아칠 무기 하나쯤은 있어야지. 제작대 목록에 나무 몽둥이가 있을 거야.\n몽둥이 제작 뒤:\n1. 숲에서 짐승이 코앞까지 오면 피할 틈이 없을 때도 있어. 그럴 때 쓸 나무 방패가 제작 목록에 있더라.","몽둥이 전:\n1. 덤벼 오는 짐승을 밀어낼 때 쓸 무기야. 제작대 앞에서 E를 누르고 나무 몽둥이를 골라 봐. 필요한 재료가 나올 거야.\n몽둥이 제작 뒤:\n1. 몽둥이 든 손은 받아칠 때 쓰고, 다른 손엔 막을 걸 들자. 제작대 앞에서 E를 누르고 나무 방패를 골라 봐.","몽둥이 전:\n1. 숲에서 맞닥뜨린 짐승을 받아칠 무기부터 챙겨 두자. 제작대에서 E로 나무 몽둥이를 골라 만들어 봐. 목재 2개면 돼.\n몽둥이 제작 뒤:\n1. 피할 틈이 없을 때 앞을 막아 줄 게 있으면 든든하지. 제작대에서 E로 나무 방패를 골라 만들어 봐. 목재 3개면 돼."],["자동 목표","ship_work","선체 공사","동행 완료 + 건조대에 선체가 있고 미완성","선체 완성","1. 배는 한 번에 쌓으면 기울어져. 건조대에서 E로 이번 단계 재료를 줘. 내가 맞추고 못을 박을게.","1. 이번 단계 작업이 끝나면 다음 재료를 가져와. 완성된 갑판부터 쓸 수 있어.","1. 내가 작업하는 동안은 혼자 따라가진 못해. 다 끝나기 전엔 배도 못 띄워.","1. 건조대 가까운 육지에서 E → 자재 넣기. 한 단계씩 완성하자."],["자동 목표","lumen_armor","원숭이와 싸울 준비 (발견형)","몽둥이·방패 제작 + 시미아 원숭이(fera·lapis)와 실제 교전 기록. 반복 목표","루멘 상의 이상 방어력 상의 착용","가방에 같은 이상 방어 상의가 있으면 모든 단계 공통(장착 안내):\n1. {대상}와 싸우기 전에 가방의 {상의}부터 장착해.\n2. 가방에 {상의} 있네. {대상}를 상대하기 전에 입어 두자.\n3. 가방(Tab)에서 {상의}를 골라 장착해. 그다음 {대상}한테 가자.\n그 외:\n1. 원숭이 떼, 생각보다 훨씬 세던데. 맨몸으로 또 붙는 건 좀 무섭다.\n2. 아까 원숭이 떼한테 꽤 맞았지? 나까지 아픈 것 같았어.\n3. 원숭이 떼랑 다시 싸우려면… 지금 차림으론 좀 불안한데.","1. 원숭이 떼한테 또 갈 거면 몸을 지킬 걸 하나 걸쳐야겠어. 입을 만한 거 만들 수 없나?\n2. 맞고 버티려면 옷이 좀 튼튼해야 하지 않을까? 제작 노트에 입을 거 있었나 봐 봐.\n3. 원숭이 떼 상대로는 무기보다 몸 지킬 게 먼저일지도 몰라.","1. 원숭이 떼한테 가기 전에 루멘 상의부터 만들어 입자. 루멘리스크에게서 루멘 가죽을 얻을 수 있어.\n2. 원숭이 떼를 상대할 거라면 루멘 상의를 입고 가. 루멘리스크에게서 루멘 가죽을 얻을 수 있어.\n3. 루멘 상의 어때? 루멘리스크에게서 루멘 가죽을 얻을 수 있어.","4단계는 자동으로 말하지 않음. E·채팅으로 물을 때만:\n1. 재료는 {재료 목록}. {제작 위치} 루멘 상의를 만들고 가방에서 장착해.\n2. 루멘리스크에게서 루멘 가죽을 얻을 수 있어. {제작 위치} 루멘 상의를 만들고 가방에서 장착해.\n3. 원숭이 떼한테 가기 전에 {제작 위치} 루멘 상의를 만들고 가방에서 장착해."],["자동 목표","simia_armor","브루카와 싸울 준비 (발견형)","몽둥이·방패 제작 + 브루카와 실제 교전 기록. 반복 목표. A-14가 0단계 반응을 대신하면 이 목표의 0단계는 5분 미룸","시미아 상의 이상 방어력 상의 착용","가방에 같은 이상 방어 상의가 있으면 모든 단계 공통(장착 안내):\n1. {대상}와 싸우기 전에 가방의 {상의}부터 장착해.\n2. 가방에 {상의} 있네. {대상}를 상대하기 전에 입어 두자.\n3. 가방(Tab)에서 {상의}를 골라 장착해. 그다음 {대상}한테 가자.\n그 외:\n1. 브루카, 생각보다 훨씬 세던데. 맨몸으로 또 붙는 건 좀 무섭다.\n2. 아까 브루카한테 꽤 맞았지? 나까지 아픈 것 같았어.\n3. 브루카랑 다시 싸우려면… 지금 차림으론 좀 불안한데.","1. 브루카한테 또 갈 거면 몸을 지킬 걸 하나 걸쳐야겠어. 입을 만한 거 만들 수 없나?\n2. 맞고 버티려면 옷이 좀 튼튼해야 하지 않을까? 제작 노트에 입을 거 있었나 봐 봐.\n3. 브루카 상대로는 무기보다 몸 지킬 게 먼저일지도 몰라.","1. 브루카한테 가기 전에 시미아 상의부터 만들어 입자. 시미아 원숭이에게서 시미아 가죽과 시미아 털을 얻을 수 있어.\n2. 브루카를 상대할 거라면 시미아 상의를 입고 가. 시미아 원숭이에게서 시미아 가죽과 시미아 털을 얻을 수 있어.\n3. 시미아 상의 어때? 시미아 원숭이에게서 시미아 가죽과 시미아 털을 얻을 수 있어.","4단계는 자동으로 말하지 않음. E·채팅으로 물을 때만:\n1. 재료는 {재료 목록}. {제작 위치} 시미아 상의를 만들고 가방에서 장착해.\n2. 시미아 원숭이에게서 시미아 가죽과 시미아 털을 얻을 수 있어. {제작 위치} 시미아 상의를 만들고 가방에서 장착해.\n3. 브루카한테 가기 전에 {제작 위치} 시미아 상의를 만들고 가방에서 장착해."],["자동 목표","hardwood","단단한 도구 재료 (발견형)","동행 + 몽둥이·방패 제작 + 제작대 + 교전한 몬스터 대비 완료 + 단단한 목재 미발견","단단한 목재 발견","1. 보통 목재로 자루를 만들면 금방 부러질 것 같아. 더 단단한 나무 없을까?","1. 숲마다 나무 생김새가 다르더라. 줄기가 유난히 짙은 나무 본 적 있어?","1. 원숭이들 사는 숲 쪽에 흑심나무가 있었던 것 같아. 그걸 베면 단단한 목재가 나오지 않을까?","4단계는 자동으로 말하지 않음. E·채팅으로 물을 때만:\n(펩이 가까운 흑심나무 쪽을 봄)\n1. 흑심나무를 도끼로 {공격}. 쓰러진 통나무도 더 쳐야 단단한 목재가 나와. 돌 곡괭이에 두 개가 필요해."],["자동 목표","pickaxe","채광 준비 (발견형)","동행 + 제작대 + 대비 완료 + 단단한 목재 발견 + 곡괭이 미소지","곡괭이 소지","1. 이 단단한 나무, 자루로 쓰면 뭐든 깰 수 있을 것 같지 않아?","1. 바위 속까지 파고들 연장이 있으면 좋겠다. 도끼로 바위를 치면 날만 상할 거야.","1. 단단한 자루에 돌을 달면 곡괭이가 되겠다. 제작대에서 단단한 목재 2 · 돌 2면 될걸?","4단계는 자동으로 말하지 않음. E·채팅으로 물을 때만:\n1. 제작대에서 E → 돌 곡괭이. 준비되면 미니맵의 점토층·구리 광맥 표시를 찾아가 봐."],["자동 목표","kiln","첫 숯가마 (발견형)","동행 + 대비 완료 + 단단한 목재 + 제작대 + 곡괭이 + 첫 숯가마 미완료. 점토 첫 발견 시 다음 단계 대기 재시작","첫 숯가마 완성(펩 공사)","점토 발견 전:\n1. 배에 박을 못을 만들려면 불을 엄청 세게 때야 할 텐데… 모닥불로는 어림없겠지?\n점토 발견 뒤:\n1. 이 흙이면 불을 견디는 숯가마를 쌓을 수 있어. 여기서 나무를 구워 숯을 만드는 거야.","점토 발견 전:\n1. 센 불을 버티려면 흙으로 쌓은 가마 같은 게 있어야 할 것 같아. 쓸 만한 흙이 어디 있을까?\n점토 발견 뒤:\n1. 숯가마에 쓸 재료부터 모으자. 단단한 목재 4 · 돌 8 · 점토 5가 필요해.","점토 발견 전:\n1. 숯가마는 점토로 쌓아. 흙빛 띠가 보이는 점토층을 곡괭이로 캐 보자.\n점토 발견 뒤:\n1. 단단한 목재 4 · 돌 8 · 점토 5를 모아서 숯가마 놓을 자리를 골라 줘. 처음엔 내가 만들게.","4단계는 자동으로 말하지 않음. E·채팅으로 물을 때만:\n점토 발견 전:\n1. 시미아 황야의 점토층을 찾아봐. 미니맵의 점토층 표시를 따라가면 쉬워. 점토를 챙기면 숯가마는 내가 쌓아 줄게.\n점토 발견 뒤:\n1. 재료를 다 모으면 건설 모드(X) → 시설에 숯가마가 나타나. 놓을 자리를 정해 주면 내가 2분쯤 작업할게."],["자동 목표","furnace","첫 용광로","동행 + 대비 완료 + 첫 숯가마 완료 + 숯 발견 + 첫 용광로 미완료","첫 용광로 완성(펩 공사)","1. 숯은 준비됐네. 이제 광석을 녹일 용광로를 만들자. 배에 쓸 못의 금속을 여기서 만들 거야. 첫 번째는 내가 세울게.","1. 돌 15 · 점토 10 · 숯 10이 필요해. 재료랑 자리만 준비해 줘.","1. 건설 모드(X)에서 용광로 자리를 정해 줘. 재료를 받으면 3분쯤 작업할게. 그동안은 못 따라가.","1. 건설 모드(X) → 시설 → 용광로. 재료를 다 모아 목록에 나타나면 평평한 곳에 놓아 줘. 내가 만들게."],["자동 목표","boat_materials","배를 만들 준비 (발견형)","동행 + 대비 완료 + 첫 용광로 완료 + 구리못 미발견. 구리 광석·주괴 첫 발견 시 다음 단계 대기 재시작","구리못 발견","구리 주괴 소지 시 모든 단계 공통:\n1. 구리 주괴가 준비됐네. 제작대에서 E → 구리못 → 제작. 배에 쓸 못을 만들자.\n그 외:\n1. 용광로까지 생겼네! 뭘 녹여 볼까? 바위 속에 반짝이는 게 섞인 데 본 적 있어?","1. 배에 박을 못은 금속이어야 할 텐데. 곡괭이로 바위를 이것저것 깨 보면 녹일 만한 돌이 나오지 않을까?","1. 구리 광석을 용광로에 숯이랑 넣으면 구리 주괴가 나와. 그걸로 배에 쓸 구리못을 만들자.","4단계는 자동으로 말하지 않음. E·채팅으로 물을 때만:\n곡괭이 소지:\n1. 가지고 있는 곡괭이로 구리 광석을 캐자. 미니맵의 구리 광맥 표시를 찾아가 봐. 점토층 표시와 색이 달라. 용광로에 구리 광석 2 · 숯 1이면 구리 주괴야.\n곡괭이 없음:\n1. 제작대에서 돌 곡괭이를 만들어 구리 광석을 캐자. 용광로에 구리 광석 2 · 숯 1을 넣으면 구리 주괴, 그걸로 구리못을 만들어."],["자동 목표","journey","돌아갈 길 (발견형, 2026-11-09 신설)","동행 + 대비 완료 + 첫 용광로 완료 + 구리못 발견 + 다른 활성 목표 없음. 기존 '활성 목표 없음 300초마다 북쪽 승강 장치' 반복 안내를 대체","없음(4단계 이후 자동 발화 없음)","1. 여기서 평생 살 건 아니지? 집에 돌아갈 길을 찾아야 할 텐데…\n2. 이 섬도 정들었지만, 너는 위로 돌아가야 하잖아.\n3. 배까지 만들 생각을 했으니… 이제 어디로 갈지 정해야겠지?","1. 넓은 물 건너편, 가 본 적 있어? 저쪽이 계속 궁금하더라.\n2. 물 건너 저 멀리, 뭔가 있을 것 같지 않아?","1. 북쪽 물길 너머였던 것 같아. 위로 올라가는 장치가 있던 데가.\n2. 북쪽으로 물을 건너면… 우리 종족이 쓰던 장치가 있었을 거야.","4단계는 자동으로 말하지 않음. E·채팅으로 물을 때만:\n1. 다음 길은 북쪽이야. 넓은 물을 건너면 승강 장치가 있는 곳으로 갈 수 있어. 물을 건널 준비부터 하자.\n2. 여기서 계속 살 생각은 아니지? 북쪽의 넓은 물 건너에 승강 장치가 있어. 배를 마련해서 가 보자.\n3. 북쪽 물길 너머에 승강 장치가 있어. 건너갈 준비가 되면 찾아보자."],["■ 자동 발화 공통 규칙","","","","","","","",""],["공통","발동","동행 뒤 목표 신규 활성/단계 상승/돌도끼 재료 완비 때 대기열에 올린다. 단계는 '막힌 플레이 시간' 0·5·15·30분(warm은 0·1·2.5·5분)에 오른다. 같은 대사를 시간마다 반복하지 않는다. (2026-11-09 단계적 공개 원칙: docs/peb_staged_hint_design_principles_2026-11-09.md)","","","","","",""],["공통","막힘 판정","새 아이템을 발견하면 3분 동안 생존 목표(warm·eat·bed·sleep) 외의 목표는 막힌 시간을 세지 않는다(탐험 중 유예). 목표별 관련 재료(axe: 나뭇가지·돌·질긴 덩굴 / bed: 목재·루멘 가죽 / kiln: 점토 / boat_materials: 구리 광석·주괴)를 스스로 처음 찾으면 다음 단계까지 대기를 다시 시작한다. 이미 오른 단계는 낮추지 않는다.","","","","","",""],["공통","발견형 목표","lumen_armor·simia_armor·hardwood·pickaxe·kiln·boat_materials·journey는 자동으로 3단계(15~30분 칸)까지만 말한다. 정확한 위치·미니맵 표시·전체 절차(4단계 칸)는 E 또는 채팅으로 물을 때만 말하며 펩이 대상 쪽을 본다.","","","","","",""],["공통","실제 말하기","실제 플레이 중 + 펩 화면 안·가림 없음 + 플레이어와 2.8m 이하 + 펩 can_talk. 공사·수영·전투 중 자동 조언은 미룬다. 그라믹 무기 전환 경고는 아래 별도 조건(12m·전투 중 즉시)을 사용한다.","","","","","",""],["공통","시간 계산","메뉴·일시정지·수면·불피우기 미니게임·외부 연출 제어는 시간 제외. 전투·수영·공사 중에는 발화는 미뤄도 목표 경과 시간이 진행될 수 있다.","","","","","",""],["공통","간격","발화 뒤 15초 조용히. 다른 목표는 이후 연속으로 가능. 같은 목표 자동 재발화 최소 300초. 새 아이템 발견·목표 해결 시에도 최소 15초 미룸. 그라믹 경고는 일반 15초 대기보다 우선하며 자체 300초 제한을 지킨다.","","","","","",""],["공통","선택 순서","최우선 별도 알림(A-13 등) → 도끼가 생겼고 퀵슬롯을 등록한 적 없으면 A-21(warm·eat 활성 시 제외) → warm → eat → axe → chop → bed → sleep → roof → walls → workbench → station_craft → ship_work → lumen_armor → simia_armor → hardwood → pickaxe → kiln → furnace → boat_materials → journey → 그 외 별도 알림. 가장 앞선 활성 목표가 5분 대기 중이면 다음 목표를 먼저 말하지 않음. 광물 알림(A-18~20)도 해당 단계일 때만 발화.","","","","","",""],["공통","무작위","현재 조건이 고른 단계/분기 안에서 변주를 무작위 선택하고 같은 목표·단계의 직전 문구만 피한다. 문장별 추가 상황 조건은 없다.","","","","","",""],["공통","완료·저장","일반 목표는 완료를 저장하면 다시 열리지 않음. eat만 배고픔 재발 때 재활성(채팅으로 올린 단계 하한 유지). 불러오기 시 활성 목표를 대기열에 다시 넣고 남은 5분 제한을 복원한다.","","","","","",""],["공통","E/Enter","E는 자동과 같은 목표 문구를 요청하며 자동 5분 제한을 건너뜀. Enter는 별도 입력형 AI 대화. 직접 도움 응답으로 채택된 목표만 단계 1칸 올리고 저장. 가까운 공사 응답은 고정 농담, 먼 입력은 회색 시스템 안내. 표의 키는 기본 설정(상호작용 E·가방 Tab·제작 C·건설 X) 기준이며, 게임에서는 플레이어가 바꾼 현재 키로 바뀌어 나온다.","","","","","",""],["공통","표시","자동 대사는 머리 위 5초(끝 1초 페이드) + 미니맵 아래 최근 대화, E 대사·연출 대화는 머리 위(또는 대화창)에만 띄운다. 자동 혼잣말·도움말·E 대화·연출 대화·알림·채팅 답은 모두 펩의 말 기록과 Enter로 연 채팅창에 남고, 새 말이 오면 채팅창은 맨 아래로 스크롤한다(2026-11-09). Enter 대화 청취 한계 8m와 자동 발화 2.8m는 별도. 그라믹 경고는 머리 위 표시가 불가능하면 미니맵 아래 대화 피드에 즉시 표시한다. 펩은 조작키를 먼저 말하지 않고, 채팅은 처음 열 때까지 미니맵 아래 펩 버튼이 은은하게 반짝여 알린다.","","","","","",""],["■ 먼저 알려주기 · 실제 연결된 별도 알림","","","","","","","",""],["분류","ID","제목","실제 발동 조건","종료·반복","실제 문구","우선순위","주의","근거"],["별도 알림","A-01","동행 시작","동행 후 플레이 시간 15초","저장 기준 1회","난 바로 옆에 있을게… 먹을 거 있으면 더 가까이. 혹시 어디 끼어서 못 움직이면 “끼었어”라고 말해 줘. 내가 끌어내 줄게.","중","펩 지식 예시가 변환된 knowledge.json의 실제 문구","peb_notices.gd"],["별도 알림","A-11","가방이 가득 찼을 때","가방 칸이 없어 줍기에 실패 + 나무 상자 설계도를 앎. 아직 만들지 않은 상위 배낭(구리·시미아)이 있으면 한 문장 덧붙임","저장 기준 1회","어, 더는 안 들어가네. 건설 모드({open_building})의 시설 탭에서 나무 상자를 하나 만들어 봐. 가방도 좀 쉬게 해 주자.\n(+상위 배낭) 아, 제작대에서 {배낭}을 만들어 메도 자리가 좀 늘겠네.","낮음","실패 트리거·UI 안내라 직
